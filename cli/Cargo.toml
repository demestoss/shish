[package]
name = "shish"
version = "0.1.0"
authors = ["Dmitriy Popov <me@demestoss.com>"]
edition = "2021"

[lib]
name = "shish"
path = "./src/lib/mod.rs"

[[bin]]
name = "shish"
path = "./src/main.rs"

[dependencies]
anyhow = "1.0.68"                                # error handling
thiserror = "1.0.38"
clap = { version = "4.5.13", features = ["derive"] }                             # error handling
shlex = "1.3.0"
rand = "0.8.5"
colorful = "0.3.2"
glob = "0.3.1"
buildin_cat = { version = "0.1.0", path = "../buildins/cat" }
buildin_cd = { version = "0.1.0", path = "../buildins/cd" }
buildin_echo = { version = "0.1.0", path = "../buildins/echo" }
buildin_exit = { version = "0.1.0", path = "../buildins/exit" }
buildin_false = { version = "0.1.0", path = "../buildins/false" }
buildin_true = { version = "0.1.0", path = "../buildins/true" }
buildin_head = { version = "0.1.0", path = "../buildins/head" }
buildin_mkdir = { version = "0.1.0", path = "../buildins/mkdir" }
buildin_pwd = { version = "0.1.0", path = "../buildins/pwd" }
buildin_touch = { version = "0.1.0", path = "../buildins/touch" }
buildin_type = { version = "0.1.0", path = "../buildins/type" }
buildin = { version = "0.1.0", path = "../buildins/buildin" }

[dev-dependencies]
assert_cmd = "2.0.15"
pretty_assertions = "1.4.0"
